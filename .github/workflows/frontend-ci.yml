name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "securecode-web/**"
  pull_request:
    branches: [main]
    paths:
      - "securecode-web/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: securecode-web/package-lock.json

      - name: Install dependencies
        working-directory: securecode-web
        run: npm ci

      - name: Type check
        working-directory: securecode-web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: securecode-web
        run: npx vitest run --coverage

      - name: Build
        working-directory: securecode-web
        run: npm run build

  e2e-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: securecode-web/package-lock.json

      - name: Install dependencies
        working-directory: securecode-web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: securecode-web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: securecode-web
        run: npx playwright test --project=chromium
        env:
          CI: true
