name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "securecode-platform/**"
  pull_request:
    branches: [main]
    paths:
      - "securecode-platform/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test
        working-directory: securecode-platform
        run: mvn -B verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: securecode-platform/**/target/surefire-reports/

  build-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - api-gateway
          - identity-service
          - assessment-service
          - execution-service
          - proctoring-service
          - reporting-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: securecode-platform
          file: securecode-platform/Dockerfile.service
          build-args: SERVICE_NAME=${{ matrix.service }}
          tags: securecode/${{ matrix.service }}:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
