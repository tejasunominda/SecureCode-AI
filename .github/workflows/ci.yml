name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  SECURECODE_JWT_SECRET: ${{ secrets.SECURECODE_JWT_SECRET }}

jobs:
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: securecode
          POSTGRES_PASSWORD: securecode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Create databases
        run: |
          PGPASSWORD=securecode psql -h localhost -U securecode -c "CREATE DATABASE securecode_identity;"
          PGPASSWORD=securecode psql -h localhost -U securecode -c "CREATE DATABASE securecode_assessment;"
          PGPASSWORD=securecode psql -h localhost -U securecode -c "CREATE DATABASE securecode_proctoring;"
          PGPASSWORD=securecode psql -h localhost -U securecode -c "CREATE DATABASE securecode_reporting;"
      - name: Build with Maven
        working-directory: backend
        run: mvn -B verify -DskipTests

  frontend-build-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --passWithNoTests

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: securecode
          POSTGRES_PASSWORD: securecode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Create databases
        run: |
          PGPASSWORD=securecode psql -h localhost -U securecode -c "CREATE DATABASE securecode_identity;"
          PGPASSWORD=securecode psql -h localhost -U securecode -c "CREATE DATABASE securecode_assessment;"
      - name: Build backend
        working-directory: backend
        run: mvn -B package -DskipTests
      - name: Start identity service
        env:
          SECURECODE_JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1jZC1waXBlbGluZS1oZWFsdGgtY2hlY2tz
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/securecode_identity
        run: |
          java -jar backend/identity-service/target/identity-service-*.jar &
          sleep 15
      - name: Start assessment service
        env:
          SECURECODE_JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1jZC1waXBlbGluZS1oZWFsdGgtY2hlY2tz
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/securecode_assessment
        run: |
          java -jar backend/assessment-service/target/assessment-service-*.jar &
          sleep 15
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend dev server
        working-directory: frontend
        run: |
          npx vite --port 5175 &
          sleep 10
      - name: Run Playwright tests
        working-directory: frontend
        env:
          SECURECODE_JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1jZC1waXBlbGluZS1oZWFsdGgtY2hlY2tz
        run: npx playwright test --reporter=list

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build backend JARs
        working-directory: backend
        run: mvn -B package -DskipTests
      - name: Build identity service image
        run: docker build -t securecode/identity-service:latest backend/identity-service/
      - name: Build assessment service image
        run: docker build -t securecode/assessment-service:latest backend/assessment-service/
