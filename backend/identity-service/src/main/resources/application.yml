server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/securecode_identity?TimeZone=UTC
    username: securecode
    password: securecode
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

securecode:
  cors:
    allowed-origins: ${SECURECODE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${SECURECODE_JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    issuer: securecode-ai
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8086}
    api-key: ${NOTIFICATION_SERVICE_API_KEY:}

sso:
  google:
    client-id: ${SSO_GOOGLE_CLIENT_ID:}
    client-secret: ${SSO_GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${SSO_GOOGLE_REDIRECT_URI:http://localhost:5175/login?provider=google}
  azure:
    client-id: ${SSO_AZURE_CLIENT_ID:}
    client-secret: ${SSO_AZURE_CLIENT_SECRET:}
    redirect-uri: ${SSO_AZURE_REDIRECT_URI:http://localhost:5175/login?provider=azure}
    tenant-id: ${SSO_AZURE_TEN_ID:common}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: identity-service
