server:
  port: 8083

securecode:
  jwt:
    secret: ${SECURECODE_JWT_SECRET}
  cors:
    allowed-origins: ${SECURECODE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  application:
    name: execution-service
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

execution:
  docker-host: unix:///var/run/docker.sock
  worker-pool-size: 4
  default-cpu-limit: "1.0"
  default-memory-limit-mb: 256
  default-wall-clock-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: execution-service
