server:
  port: 0

spring:
  application:
    name: execution-service-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379

securecode:
  security:
    permit-all: true
  jwt:
    filter:
      enabled: false
    secret: Y2hhbmdlLW1lLXBsZWFzZS1pYW0tYS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtaG1hYy1zaGEtMjU2LWJpdHM=

execution:
  docker:
    enabled: false
  wall-clock-timeout-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
