apiVersion: v1
kind: Namespace
metadata:
  name: securecode
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: securecode-config
  namespace: securecode
data:
  POSTGRES_HOST: postgres
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: Y2hhbmdlLW1lLXBsZWFzZS1pYW0tYS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtaG1hYy1zaGEtMjU2LWJpdHM=
---
apiVersion: v1
kind: Secret
metadata:
  name: securecode-db-secret
  namespace: securecode
type: Opaque
stringData:
  POSTGRES_USER: securecode
  POSTGRES_PASSWORD: securecode
---
# ─── Postgres ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: securecode
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: securecode-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securecode-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_MULTIPLE_DATABASES
              value: "securecode_identity,securecode_assessment,securecode_proctoring,securecode_reporting"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "securecode"]
            interval: 5s
            retries: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: securecode
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
# ─── Redis ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: securecode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            interval: 5s
            retries: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: securecode
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
# ─── Kafka ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: securecode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: controller,broker
            - name: KAFKA_CFG_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka:9093
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
          readinessProbe:
            exec:
              command: ["kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
            interval: 10s
            retries: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: securecode
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
---
# ─── API Gateway ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: securecode
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: securecode/api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: securecode-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            interval: 5s
            retries: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: securecode
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8080
---
# ─── Identity Service ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: securecode
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: securecode/identity-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/securecode_identity?TimeZone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: securecode-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securecode-db-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SECURECODE_JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: securecode-config
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            interval: 5s
            retries: 10
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: securecode
spec:
  selector:
    app: identity-service
  ports:
    - port: 8081
---
# ─── Assessment Service ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-service
  namespace: securecode
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assessment-service
  template:
    metadata:
      labels:
        app: assessment-service
    spec:
      containers:
        - name: assessment-service
          image: securecode/assessment-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/securecode_assessment?TimeZone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: securecode-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securecode-db-secret
                  key: POSTGRES_PASSWORD
            - name: SECURECODE_JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: securecode-config
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            interval: 5s
            retries: 10
---
apiVersion: v1
kind: Service
metadata:
  name: assessment-service
  namespace: securecode
spec:
  selector:
    app: assessment-service
  ports:
    - port: 8082
---
# ─── Execution Service ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: securecode
spec:
  replicas: 3
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
    spec:
      containers:
        - name: execution-service
          image: securecode/execution-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: EXECUTION_DOCKER_HOST
              value: unix:///var/run/docker.sock
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            interval: 5s
            retries: 10
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: execution-service
  namespace: securecode
spec:
  selector:
    app: execution-service
  ports:
    - port: 8083
---
