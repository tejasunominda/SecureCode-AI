server:
  port: 8085

securecode:
  jwt:
    secret: ${SECURECODE_JWT_SECRET}
  cors:
    allowed-origins: ${SECURECODE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:postgresql://localhost:5432/securecode_reporting
    username: securecode
    password: securecode
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: reporting-service
