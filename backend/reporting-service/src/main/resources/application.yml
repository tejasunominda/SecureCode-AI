server:
  port: 8085

spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:postgresql://localhost:5432/securecode_reporting
    username: securecode
    password: securecode
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
