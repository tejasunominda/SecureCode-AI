server:
  port: 0

spring:
  application:
    name: reporting-service-test
  datasource:
    url: jdbc:h2:mem:test_reporting;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

securecode:
  security:
    permit-all: true
  jwt:
    filter:
      enabled: false
    secret: Y2hhbmdlLW1lLXBsZWFzZS1pYW0tYS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtaG1hYy1zaGEtMjU2LWJpdHM=

management:
  endpoints:
    web:
      exposure:
        include: health,info
