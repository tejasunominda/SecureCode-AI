version: "3.9"

# ─── Infrastructure ────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securecode
      POSTGRES_PASSWORD: securecode
      POSTGRES_MULTIPLE_DATABASES: securecode_identity,securecode_assessment,securecode_proctoring,securecode_reporting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securecode"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: securecode
      MINIO_ROOT_PASSWORD: securecode123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # ─── Application Services ─────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SECURECODE_JWT_SECRET: ${SECURECODE_JWT_SECRET}
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://identity-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://assessment-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://execution-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://proctoring-service:8084
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://proctoring-service:8084
      SPRING_CLOUD_GATEWAY_ROUTES_5_URI: http://reporting-service:8085
      SPRING_CLOUD_GATEWAY_ROUTES_6_URI: http://notification-service:8086
    depends_on:
      redis:
        condition: service_healthy

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: identity-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/securecode_identity?TimeZone=UTC
      SPRING_DATASOURCE_USERNAME: securecode
      SPRING_DATASOURCE_PASSWORD: securecode
      SPRING_DATA_REDIS_HOST: redis
      SECURECODE_JWT_SECRET: ${SECURECODE_JWT_SECRET}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  assessment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: assessment-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/securecode_assessment?TimeZone=UTC
      SPRING_DATASOURCE_USERNAME: securecode
      SPRING_DATASOURCE_PASSWORD: securecode
      SPRING_DATA_REDIS_HOST: redis
      SECURECODE_JWT_SECRET: ${SECURECODE_JWT_SECRET}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  execution-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: execution-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EXECUTION_DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  proctoring-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: proctoring-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/securecode_proctoring
      SPRING_DATASOURCE_USERNAME: securecode
      SPRING_DATASOURCE_PASSWORD: securecode
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  reporting-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: reporting-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/securecode_reporting
      SPRING_DATASOURCE_USERNAME: securecode
      SPRING_DATASOURCE_PASSWORD: securecode
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: notification-service
    ports:
      - "8086:8086"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: "1025"
    depends_on:
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  pgdata:
  miniodata:
