server:
  port: 0

spring:
  application:
    name: proctoring-service-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:test_proctoring;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

securecode:
  security:
    permit-all: true
  jwt:
    filter:
      enabled: false
    secret: Y2hhbmdlLW1lLXBsZWFzZS1pYW0tYS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtaG1hYy1zaGEtMjU2LWJpdHM=

proctoring:
  alert:
    threshold:
      warning: 30
      critical: 60
      termination: 80
    max-face-lost-warnings: 3
    max-tab-switch-warnings: 2
    max-copy-paste-warnings: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info
