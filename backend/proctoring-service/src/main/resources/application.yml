server:
  port: 8084

securecode:
  jwt:
    secret: ${SECURECODE_JWT_SECRET}
  cors:
    allowed-origins: ${SECURECODE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  application:
    name: proctoring-service
  datasource:
    url: jdbc:postgresql://localhost:5432/securecode_proctoring
    username: securecode
    password: securecode
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

risk-engine:
  half-life-minutes: 10

proctoring:
  minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
  minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}
  voice-activity:
    enabled: true
    silence-threshold-db: -40
    max-silence-seconds: 30
  gaze-detection:
    enabled: true
    gaze-away-threshold-seconds: 5
  object-detection:
    enabled: true
    detect-phone: true
    detect-extra-person: true
  alert:
    threshold:
      warning: ${PROCTORING_ALERT_WARNING:30}
      critical: ${PROCTORING_ALERT_CRITICAL:60}
      termination: ${PROCTORING_ALERT_TERMINATION:80}
    max-face-lost-warnings: 3
    max-tab-switch-warnings: 2
    max-copy-paste-warnings: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: proctoring-service
