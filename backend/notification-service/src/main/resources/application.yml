server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:mem:notifications;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
  mail:
    host: localhost
    port: 1025

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: notification-service

notification:
  sms:
    enabled: false
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    twilio-from-number: ${TWILIO_FROM_NUMBER:}
  push:
    enabled: false
    fcm-server-key: ${FCM_SERVER_KEY:}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  teams:
    webhook-url: ${TEAMS_WEBHOOK_URL:}
  from-email: noreply@securecode.ai
