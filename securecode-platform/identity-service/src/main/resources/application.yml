server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/securecode_identity?TimeZone=UTC
    username: securecode
    password: securecode
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

securecode:
  jwt:
    secret: ${SECURECODE_JWT_SECRET:Y2hhbmdlLW1lLXBsZWFzZS1pYW0tYS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtaG1hYy1zaGEtMjU2LWJpdHM=}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    issuer: securecode-ai

management:
  endpoints:
    web:
      exposure:
        include: health,info
